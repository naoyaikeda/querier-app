<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Store Anime Querier</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        input, select, button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        input { flex-grow: 1; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .card:hover { transform: translateY(-3px); }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .card-info {
            padding: 10px;
        }
        .filename {
            font-size: 0.9em;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }
        .tags {
            font-size: 0.8em;
            color: #666;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .tag {
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.open { display: flex; }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 4px;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="controls">
        <select id="catalogSelect">
            <!-- Populated dynamically -->
        </select>
        <select id="tagSelect">
            <option value="">All Tags</option>
        </select>
        <select id="sortOrderSelect">
            <option value="DESC">Newest First</option>
            <option value="ASC">Oldest First</option>
        </select>
        <input type="number" id="limitInput" value="100" min="1" step="10" style="width: 80px;" title="Max items">
        <button id="searchBtn">Search</button>
    </div>
    
    <div class="results" id="resultsGrid"></div>

    <div class="modal" id="imageModal">
        <div class="modal-close">&times;</div>
        <img src="" alt="Full View">
    </div>

    <script src="renderer.js"></script>
</body>
</html>
